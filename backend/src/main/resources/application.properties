spring.application.name=ziwa

# Database Configuration - Production
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/ziwa_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DATABASE_USERNAME:php_user}
spring.datasource.password=${DATABASE_PASSWORD:Php_pass@2026}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false

# JWT Configuration
jwt.secret=${JWT_SECRET:ziwa-dairy-farm-secret-key-change-this-in-production-to-a-secure-random-value}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Server Configuration
server.port=${PORT:8080}
server.error.include-message=always
server.error.include-binding-errors=always

# CORS Configuration
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# Springdoc OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.show-actuator=false
