spring.application.name=ziwa

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/ziwa_db?createDatabaseIfNotExist=true
spring.datasource.username=php_user
spring.datasource.password=Php_pass@2026
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false

# JWT Configuration
jwt.secret=ziwa-dairy-farm-secret-key-change-this-in-production-to-a-secure-random-value
jwt.expiration=86400000

# Server Configuration
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always
# Springdoc OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.show-actuator=false
